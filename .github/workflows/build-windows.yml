name: Build Windows portable

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # The build only needs to read the repo; the release step needs to write
    # one. The repo default is read-only, so creating a release 403s without
    # this. Scoped to this job rather than loosening the repo-wide setting.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 is the newest version with prebuilt wheels for every
          # dependency, including pythonnet, which pywebview needs on Windows.
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build frontend and bundle
        run: python scripts/build.py

      - name: Verify the bundle looks right
        shell: pwsh
        run: |
          $exe = "dist/KrevonScribe/KrevonScribe.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $index = "dist/KrevonScribe/_internal/frontend_dist/index.html"
          if (-not (Test-Path $index)) { throw "frontend was not bundled ($index)" }
          # Must sit beside the exe, not under _internal/: the CLR finds it by
          # the host process name. Without it .NET refuses to load
          # Python.Runtime.dll once Windows has zone-marked the unzipped files.
          $cfg = "dist/KrevonScribe/KrevonScribe.exe.config"
          if (-not (Test-Path $cfg)) { throw "missing $cfg" }
          Write-Host "OK: $((Get-Item $exe).Length) bytes"

      # Files being present does not prove the bundle runs: PyInstaller fails
      # by dropping an import that is only reached at runtime. This starts the
      # built executable and makes it import and exercise the real thing.
      # It is a windowed build with no console on Windows, so the report is
      # read back from a file rather than from stdout.
      - name: Run the frozen self-test
        shell: pwsh
        run: |
          $exe = "dist/KrevonScribe/KrevonScribe.exe"
          $report = "selftest.txt"
          $p = Start-Process -FilePath $exe `
                             -ArgumentList "--selftest","--selftest-out",$report `
                             -Wait -PassThru -NoNewWindow
          if (Test-Path $report) { Get-Content $report } else { Write-Host "no report written" }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Stage portable folder
        shell: pwsh
        run: |
          Copy-Item README.md dist/KrevonScribe/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/KrevonScribe/* `
                           -DestinationPath KrevonScribe-windows-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: KrevonScribe-windows-portable
          path: KrevonScribe-windows-portable.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KrevonScribe-windows-portable.zip

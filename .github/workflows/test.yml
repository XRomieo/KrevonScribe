name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately pytest and nothing else. The logic suite must stay
      # runnable without a GUI toolkit or any network dependency, and
      # installing nothing else is what keeps that true: a stray top-level
      # import of requests or kaggle fails here rather than in a user's build.
      - run: pip install pytest
      - run: python -m pytest tests -q

  selftest:
    name: Self-test from source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: pip install -r requirements.txt
      - name: Build the frontend
        run: python scripts/build.py --frontend-only
      # Imports what the app imports and exercises the logic end to end,
      # without needing credentials or a network.
      - run: python app.py --selftest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
